<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A perforated stamp with a cancellation ring struck over it. -->
  <defs>
    <mask id="perf">
      <rect x="0" y="0" width="32" height="32" fill="#fff"/>
      <g fill="#000">
        <circle cx="8"  cy="3"  r="1.7"/><circle cx="16" cy="3"  r="1.7"/><circle cx="24" cy="3"  r="1.7"/>
        <circle cx="8"  cy="29" r="1.7"/><circle cx="16" cy="29" r="1.7"/><circle cx="24" cy="29" r="1.7"/>
        <circle cx="3"  cy="9"  r="1.7"/><circle cx="3"  cy="16" r="1.7"/><circle cx="3"  cy="23" r="1.7"/>
        <circle cx="29" cy="9"  r="1.7"/><circle cx="29" cy="16" r="1.7"/><circle cx="29" cy="23" r="1.7"/>
      </g>
    </mask>
  </defs>

  <rect x="3" y="3" width="26" height="26" fill="#F5F3EE" mask="url(#perf)"/>
  <rect x="6" y="6" width="20" height="20" fill="none" stroke="#17202E" stroke-width="1.2"/>
  <circle cx="17" cy="17" r="7.5" fill="none" stroke="#93242B" stroke-width="2"/>
  <line x1="9.5" y1="17" x2="24.5" y2="17" stroke="#93242B" stroke-width="1.6"/>
</svg>
